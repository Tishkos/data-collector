# REAL PLANT configuration — Erbil Coca-Cola hybrid plant.
# Start with:  START.bat -Plant        (or CHECK.bat first: one poll, every point printed)
#
# Everything here is READ-ONLY polling. Gentle on purpose: the SAU gateway is already
# busy serving the InteliNeo. One block of reads per device, once an hour.
#
# Before first use, replace the TODO values:
#   - InteliNeo unit id and the register addresses in profiles/intelineo_master.yaml
#     (from InteliConfig -> Modules -> Modbus Registers)
#   - inverter unit ids on the SAU and the addresses in profiles/inverter_sineng.yaml
#     (from the SAU point table / Sineng Modbus protocol)
#   - meter unit id and addresses in profiles/meter_site.yaml (if the LV meter is on the SAU)

site:
  site_id: erbil-cc-01
  name: "Erbil Coca-Cola hybrid plant"
  timezone: Asia/Baghdad
  fuel_price_per_l: 0.85            # TODO local diesel price
  poll_interval_s: 3600             # once an hour. The dashboard's Settings page offers 30 min / 1 h / 2 h and
                                    # saves its choice in data\settings.json, which overrides this value.

devices:
  # --- ComAp master: gensets, mains, PV totals, breakers, alarms --------------------
  - id: neo-01
    profile: intelineo_master.yaml
    adapter: modbus_tcp
    connection: {host: 192.168.0.112, port: 502, unit_id: 1, timeout: 3}     # TODO unit_id from InteliNeo Modbus settings

  # --- Sineng inverters through the SAU-100 gateway ----------------------------------------
  # unit_id = the inverter's Modbus address on the SAU (TODO from SAU point table)
  - {id: inv-01, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 1,  timeout: 5}}
  - {id: inv-02, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 2,  timeout: 5}}
  - {id: inv-03, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 3,  timeout: 5}}
  - {id: inv-04, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 4,  timeout: 5}}
  - {id: inv-05, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 5,  timeout: 5}}
  - {id: inv-06, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 6,  timeout: 5}}
  - {id: inv-07, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 7,  timeout: 5}}
  - {id: inv-08, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 8,  timeout: 5}}
  - {id: inv-09, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 9,  timeout: 5}}
  - {id: inv-10, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 10, timeout: 5}}

  # --- LV panel meter (if connected to the SAU; otherwise remove) --------------------------
  - id: pv-meter
    profile: meter_site.yaml
    adapter: modbus_tcp
    connection: {host: 192.168.0.128, port: 502, unit_id: 100, timeout: 5}   # TODO meter address on SAU

# --- Publishing for the DT Turkey / CCI monitoring platform ------------------------------------
# A read-only Modbus TCP server on this PC with all tags of profiles/tag_catalog.yaml at fixed
# registers (map: docs/TURKEY_MODBUS.md, or GET /api/v1/tags/registers). Their platform polls
# this PC, never the SAU or the InteliNeo. Switch on when the VPN is in place and set `bind`
# to the PC's VPN address so the port is not visible anywhere else.
publish:
  modbus_tcp:
    enabled: false
    bind: 0.0.0.0            # TODO the PC's VPN address, e.g. 10.8.0.12 (0.0.0.0 = every interface)
    port: 502
    unit_id: 1
    bad_value: last          # what a tag shows while its device does not answer: last | zero | nan

# When the InteliSCADA on the licensed laptop is on 24/7, this device can be added instead
# of neo-01 to get the same values with zero load on the controller:
# - id: neo-01
#   profile: intelineo_master.yaml      (points then use raw: {trend: "<trend name>"})
#   adapter: inteliscada
#   connection: {url: "http://localhost:8801", password: "<site password>"}
