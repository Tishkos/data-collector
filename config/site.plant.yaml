# REAL PLANT configuration - Erbil Coca-Cola hybrid plant.
# Start with:  START-PLANT.bat        (CHECK-PLANT.bat first: one poll, every point printed)
#
# Everything here is READ-ONLY polling. Gentle on purpose: one connection per device host,
# a few block reads per device, once an hour, connection closed afterwards.
#
# Network (session of 2026-10-14):
#   plant PC DESKTOP-91MOKR0 (Siemens IPC, Windows 10 IoT) - ComAp network on adapter "Ethernet 2"
#   (Realtek USB dongle) with the fixed address 192.168.0.200/24, no gateway; internet over the
#   CCI Wi-Fi (172.17.76.x). Move the cable to a built-in LAN port at installation and give that
#   port the same address.
#   ComAp controllers (all port 23 ComAp, port 502 Modbus):
#     Gen 1  IG4 200   192.168.0.105  SN 242535AC      MAIN 1  IM210G2  192.168.0.107  SN 24264E2B
#     Gen 2  IG4 200   192.168.0.106  SN 241635D3      MAIN 2  IM210G2  192.168.0.111  SN 24264E58
#     Gen 3  IG4 200   192.168.0.113  SN 241635B6      MAIN 3  IM210G2  192.168.0.110  SN 24264ED4
#     Gen 4  IG4 200   192.168.0.114  SN 2416350D      InteliNeo 5500  192.168.0.112  SN 240842DA
#     Gen 5  IG4 200   192.168.0.115  SN 2416355C
#   Sineng SAU-100 gateway 192.168.0.128 (ETH0), 192.168.1.123 (ETH1); 10 x SP-320K-H inverters.

site:
  site_id: erbil-cc-01
  name: "Erbil Coca-Cola hybrid plant"
  timezone: Asia/Baghdad
  fuel_price_per_l: 0.85            # TODO local diesel price
  poll_interval_s: 3600             # once an hour. The dashboard's Settings page offers 30 min / 1 h / 2 h and
                                    # saves its choice in data\settings.json, which overrides this value.

devices:
  # --- ComAp master: gensets total, mains, PV total, breakers, alarms --------------------------
  # Modbus server enabled, unit id 1 (confirmed 2026-10-14; the controller's CAN address 9 is not
  # the Modbus unit id). Registers from the controller's own Modbus export, see the profile.
  # If the first CHECK shows the bus frequency far from 50 Hz, add address_offset: -1 here.
  - id: neo-01
    profile: intelineo_master.yaml
    adapter: modbus_tcp
    connection: {host: 192.168.0.112, port: 502, unit_id: 1, timeout: 3}

  # --- Sineng inverters through the SAU-100 -------------------------------------------------------
  # Unit ids = the SAU's TCP device ids from Sineng's TCP protocol document (sheet Explain):
  # winding 1 INV#1-5 = 3-7, winding 2 INV#1-5 = 8-12. Registers in profiles/inverter_sineng.yaml.
  - {id: inv-01, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 3,  timeout: 5}}
  - {id: inv-02, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 4,  timeout: 5}}
  - {id: inv-03, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 5,  timeout: 5}}
  - {id: inv-04, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 6,  timeout: 5}}
  - {id: inv-05, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 7,  timeout: 5}}
  - {id: inv-06, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 8,  timeout: 5}}
  - {id: inv-07, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 9,  timeout: 5}}
  - {id: inv-08, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 10,  timeout: 5}}
  - {id: inv-09, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 11,  timeout: 5}}
  - {id: inv-10, profile: inverter_sineng.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 12, timeout: 5}}

  # --- the whole PV array as the SAU's virtual device (unit 245) ------------------------------------
  # Registers taken from the InteliNeo's own Modbus-master definition (archive of 2026-10-14): PV power,
  # available power before curtailment, energies, inverter counts. Unit 245 answered at register 0 on
  # 14 Oct; CHECK must show ac_power_kw equal to the Neo's PV Actual P.
  - {id: pv-array, profile: pv_array_sau.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.128, port: 502, unit_id: 245, timeout: 5}}

  # --- the three mains incomers (InteliMains 210 G2) ------------------------------------------------------
  # Registers from the Neo's Modbus-master definition for them; unit id 1 is the ComAp default - confirm on CHECK.
  - {id: main-01, profile: im210_mains.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.107, port: 502, unit_id: 1, timeout: 3}}
  - {id: main-02, profile: im210_mains.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.111, port: 502, unit_id: 1, timeout: 3}}
  - {id: main-03, profile: im210_mains.yaml, adapter: modbus_tcp, connection: {host: 192.168.0.110, port: 502, unit_id: 1, timeout: 3}}

  # No PV-side meter and no irradiance / panel-temperature sensor were found on site (the SAU's
  # meters M1 and M3 are the generator and grid feeders). The Turkey tags that need them stay
  # "not mapped" until such devices exist.

  # The genset controllers can be read directly later for per-genset detail (fuel level, engine
  # hours, alarms). Their register tables are the controllers' own Modbus lists - export them with
  # InteliConfig the same way as the Neo's before enabling:
  # - {id: gen-01,  profile: ig4_genset.yaml,     adapter: modbus_tcp, connection: {host: 192.168.0.105, port: 502, unit_id: 1, timeout: 3}}
  # - {id: gen-02,  profile: ig4_genset.yaml,     adapter: modbus_tcp, connection: {host: 192.168.0.106, port: 502, unit_id: 1, timeout: 3}}
  # - {id: gen-03,  profile: ig4_genset.yaml,     adapter: modbus_tcp, connection: {host: 192.168.0.113, port: 502, unit_id: 1, timeout: 3}}
  # - {id: gen-04,  profile: ig4_genset.yaml,     adapter: modbus_tcp, connection: {host: 192.168.0.114, port: 502, unit_id: 1, timeout: 3}}
  # - {id: gen-05,  profile: ig4_genset.yaml,     adapter: modbus_tcp, connection: {host: 192.168.0.115, port: 502, unit_id: 1, timeout: 3}}

# --- probe: the hosts PROBE-PLANT.bat tries besides the devices above (one read of one register) ---
probe:
  hosts: [192.168.0.105, 192.168.0.106, 192.168.0.113, 192.168.0.114, 192.168.0.115]

# --- Publishing for the DT Turkey / CCI monitoring platform ------------------------------------
# A read-only Modbus TCP server on this PC with all tags of profiles/tag_catalog.yaml at fixed
# registers (map: docs/TURKEY_MODBUS.md, or GET /api/v1/tags/registers). Their platform polls
# this PC, never the SAU or the InteliNeo. Switch on when the VPN is in place and set `bind`
# to the PC's VPN address so the port is not visible anywhere else. Port 502 is free on the PC.
publish:
  modbus_tcp:
    enabled: false
    bind: 0.0.0.0            # TODO the PC's VPN address (0.0.0.0 = every interface)
    port: 502
    unit_id: 1
    bad_value: last          # what a tag shows while its device does not answer: last | zero | nan

# When the InteliSCADA on the licensed laptop is on 24/7, this device can be added instead
# of neo-01 to get the same values with zero load on the controller:
# - id: neo-01
#   profile: intelineo_master.yaml      (points then use raw: {trend: "<trend name>"})
#   adapter: inteliscada
#   connection: {url: "http://localhost:8801", password: "<site password>"}
