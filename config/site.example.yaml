# Site configuration. Copy to config/site.yaml (git-ignored) and fill real values.
#
# adapter: simulator  -> runs against the built-in plant model (safe, default)
# adapter: modbus_tcp -> real device over Modbus TCP (needs real profile addresses)
# adapter: comap_wsv  -> ComAp WebSupervisor cloud API (needs COMAP_KEY etc. in env)

site:
  site_id: erbil-cc-01
  name: "Erbil Coca-Cola hybrid plant"
  timezone: Asia/Baghdad
  mode: supervised                    # manual | supervised | autonomous | restricted
  policy_revision: 1
  approval_ttl_s: 300
  max_automated_commands_per_hour: 12
  fuel_price_per_l: 0.85              # TODO local diesel price (currency of your choice)
  bess_cycle_cost_per_kwh: 0.04
  genset_start_cost: 3.0
  # What the automation identity may do without a human click, once mode=autonomous.
  autonomous_allowlist:
    - {device: pv-01,     command: set_power_limit}
    - {device: bess-01,   command: set_active_power_target}
    - {device: genset-01, command: set_power_target}
    # NOTE: genset start/stop are deliberately NOT here. Those stay supervised.

devices:
  - id: genset-01
    profile: genset_comap.yaml
    adapter: simulator
    connection: {}          # modbus_tcp example: {host: 192.0.2.10, port: 502, unit_id: 1}

  - id: genset-02
    profile: genset_comap.yaml
    adapter: simulator
    connection: {}

  - id: pv-01
    profile: pv_sunspec.yaml
    adapter: simulator
    connection: {}

  - id: bess-01
    profile: bess_generic.yaml
    adapter: simulator
    connection: {}

  - id: meter-01
    profile: meter_site.yaml
    adapter: simulator
    connection: {}

site_load:
  # simulator only — typical bottling plant profile, kW by hour (0..23)
  profile_kw: [220,210,210,215,230,280,420,560,640,680,700,710,700,690,680,660,620,560,480,400,340,300,260,240]
