# Device profile: PV plant via inverter data-logger (SunSpec-style Modbus).
# raw addresses are PLACEHOLDERS — confirm base offset + scale factors per logger.

kind: pv
vendor: "TBC (Huawei / Sungrow / SMA ...)"
model: "data logger TBC"
profile_revision: 1
profile_status: draft
source_document: "logger Modbus map — TO BE ATTACHED"

limits:
  rated_kw: 800            # TODO real DC/AC rating
  curtail_min_pct: 10      # never limit below 10% (keeps inverters awake)

points:
  - {id: power_kw,          unit: kW,  raw: {address: 40083, kind: int16, scale: 0.01}}   # TODO
  - {id: available_kw,      unit: kW,  raw: {address: 40084, kind: int16, scale: 0.01}}   # TODO (if logger exposes)
  - {id: energy_today_kwh,  unit: kWh, raw: {address: 40093, kind: uint32, scale: 0.001}} # TODO
  - {id: energy_total_kwh,  unit: kWh, raw: {address: 40095, kind: uint32, scale: 0.001}} # TODO
  - {id: irradiance_wm2,    unit: W/m2, raw: {address: 40200, kind: uint16}}              # TODO
  - {id: inverters_online,  unit: "",  raw: {address: 40201, kind: uint16}}               # TODO
  - {id: status,            type: enum, raw: {address: 40107, kind: uint16}}              # TODO
  - {id: power_limit_pct,   unit: "%", access: read_write, raw: {address: 40232, kind: uint16}}  # TODO

commands:
  - id: set_power_limit
    category: operational_setpoint
    risk_class: C2
    description: "Active-power limit (% of rated). 100 = no curtailment. Curtail only as last resort."
    args: {limit_pct: {type: number, unit: "%", min: 10, max: 100}}
    preconditions: [device_healthy, telemetry_fresh, within_commissioned_limits]
    verification: {point: power_limit_pct, strategy: readback_within, tolerance: 1.0, timeout_s: 15}
    allowed_modes: [manual, supervised, autonomous]
    requires_approval: false
    min_interval_s: 60
    raw: {address: 40232, kind: uint16}           # TODO
