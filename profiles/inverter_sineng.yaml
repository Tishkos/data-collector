# Device profile: one Sineng string inverter, read THROUGH the SAU-100 gateway (read-only).
#
# All ten inverters share this profile; config/site.plant.yaml sets the unit_id per inverter.
# Registers are PLACEHOLDERS until the SAU point table / Sineng Modbus protocol for the
# installed model is available. The collector reads each inverter as ONE block.
#
# Point ids here are what profiles/tag_catalog.yaml maps the DT Turkey tag names onto.

kind: pv
vendor: Sineng
model: "string inverter (model TBC)"
profile_revision: 2
profile_status: draft
source_document: "SAU-100 point table / Sineng Modbus protocol — TO BE ATTACHED"

points:
  - {id: ac_power_kw,       unit: kW,  raw: {address: 0,  kind: uint32, scale: 0.001}}   # TODO
  - {id: dc_power_kw,       unit: kW,  raw: {address: 2,  kind: uint32, scale: 0.001}}   # TODO
  - {id: frequency_hz,      unit: Hz,  raw: {address: 4,  kind: uint16, scale: 0.01}}    # TODO
  - {id: current_l1_a,      unit: A,   raw: {address: 5,  kind: uint16, scale: 0.1}}     # TODO
  - {id: current_l2_a,      unit: A,   raw: {address: 6,  kind: uint16, scale: 0.1}}     # TODO
  - {id: current_l3_a,      unit: A,   raw: {address: 7,  kind: uint16, scale: 0.1}}     # TODO
  - {id: voltage_l1_v,      unit: V,   raw: {address: 8,  kind: uint16, scale: 0.1}}     # TODO
  - {id: voltage_l2_v,      unit: V,   raw: {address: 9,  kind: uint16, scale: 0.1}}     # TODO
  - {id: voltage_l3_v,      unit: V,   raw: {address: 10, kind: uint16, scale: 0.1}}     # TODO
  - {id: energy_today_kwh,  unit: kWh, raw: {address: 11, kind: uint32, scale: 0.1}}     # TODO
  - {id: energy_total_kwh,  unit: kWh, raw: {address: 13, kind: uint32, scale: 1.0}}     # TODO
