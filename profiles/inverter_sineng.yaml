# Device profile: one Sineng SP-320K-H string inverter, read THROUGH the SAU-100 gateway (read-only).
#
# Site facts (SAU device export 2026-10-14): 10 x SP-320K-H, 320 kW / 320 kVA each (3.2 MW),
# AC side 800 V (line voltage ~834 V). Named on the SAU "winding 1 INV#1..5" and "winding 2 INV#1..5".
#
# Registers: Sineng's TCP protocol document for this plant ("QIMAH Iraq 5.58MW Coca Cola Plant
# Photovoltaic Project TCP Protocol Document", sheet INV, received 2026-10-20). Addresses as in the
# document = the protocol (0-based) address; a tool like Modscan shows them +1. Function 03 or 04.
# TCP device ids (sheet Explain): winding 1 INV#1-5 = 3-7, winding 2 INV#1-5 = 8-12 (the SAU's own
# device numbers); config/site.plant.yaml sets them. Only reads; the document's write registers
# (1418-1487 settings, 1900/1903/1927 start/stop) are never touched.
#
# Point ids here are what profiles/tag_catalog.yaml maps the DT Turkey tag names onto.

kind: pv
vendor: Sineng
model: "SP-320K-H string inverter, 320 kW, 12 strings"
profile_revision: 4
profile_status: mapped (Sineng TCP protocol document)
source_document: "QIMAH Iraq 5.58MW Coca Cola Plant PV Project TCP Protocol Document (Sineng), sheet INV"

limits: {rated_kw: 320}

