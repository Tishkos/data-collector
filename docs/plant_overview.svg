<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" class="d" role="img" aria-label="Single-line and communication overview of the Erbil hybrid plant: three grid incomers with InteliMains 210 G2 controllers feed a plant bus; five gensets with IG4 200 controllers and ten Sineng inverters behind two PV breakers feed the same bus; the InteliNeo 5500 master talks to the genset and mains controllers over CAN and to the Sineng SAU-100 over Modbus TCP, where it writes the PV setpoint; two UPS with unverified wiring hang off the plant load; a plant PC runs the read-only collector.">
<style>
.d text { font-family: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #1d2229; }
.d .hdr { font-weight: 600; }
.d .muted { fill: #5c6570; font-size: 12px; }
.d .pwr { stroke: #1d2229; stroke-width: 1.6; fill: none; stroke-linecap: round; }
.d .bus { stroke: #1d2229; stroke-width: 5; stroke-linecap: round; }
.d .dot { fill: #1d2229; }
.d .gen { stroke: #1d2229; stroke-width: 1.6; fill: #ffffff; }
.d .dev { stroke: #1d2229; stroke-width: 1.2; fill: #ffffff; }
.d .dev-v { stroke: #a86d00; stroke-width: 1.2; stroke-dasharray: 5 4; fill: #ffffff; }
.d .comm { stroke: #1f5fbf; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
.d .comm-t { fill: #1f5fbf; }
.d .comm-f { fill: #1f5fbf; }
.d .verify { stroke: #a86d00; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
.d .verify-t { fill: #a86d00; }
.d .cmd { fill: #5c6570; font-style: italic; }
</style>
